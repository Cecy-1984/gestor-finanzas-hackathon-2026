<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <main class="mx-auto max-w-4xl p-5">
        <h1 class="mb-2 text-3xl font-bold">Mis finanzas</h1>
        <p class="mb-6">Registrá tus ingresos y gastos.</p>
        <section class="mb-6 rounded bg-white p-4">
            <h2 class="mb-3 text-xl font-bold">Balance</h2>
            <p>Ingresos: <strong id="ingresos">$0</strong></p>
            <p>Gastos: <strong id="gastos">$0</strong></p>
            <p>Balance: <strong id="saldo">$0</strong></p>
        </section>
        <section class="mb-6 rounded bg-white p-4">
            <h2 class="mb-3 text-xl font-bold">Nuevo movimiento</h2>
            <form id="formulario" class="grid gap-3">
                <label>Descripción
                    <input id="descripcion" type="text" required class="w-full rounded border p-2">
                </label>
                <label>Monto
                    <input id="monto" type="number" min="0.01" step="0.01" required class="w-full rounded border p-2">
                </label>
                <label>Tipo
                    <select id="tipo" class="w-full rounded border p-2">
                        <option value="ingreso">Ingreso</option>
                        <option value="gasto">Gasto</option>
                    </select>
                </label>
                <label>Categoría
                    <select id="categoria" class="w-full rounded border p-2">
                        <option value="sueldo">Sueldo</option>
                        <option value="comida">Comida</option>
                        <option value="transporte">Transporte</option>
                        <option value="vivienda">Vivienda</option>
                        <option value="salud">Salud</option>
                        <option value="otros">Otros</option>
                    </select>
                </label>
                <button type="submit" class="rounded bg-blue-600 p-2 text-white hover:bg-blue-700">Agregar</button>
            </form>
            <p id="aviso" class="mt-2 text-sm"></p>
        </section>
        <section class="mb-6 rounded bg-white p-4">
            <h2 class="mb-3 text-xl font-bold">Movimientos registrados</h2>
            <div id="lista" class="grid gap-2"></div>
        </section>
        <section class="rounded bg-white p-4">
            <h2 class="mb-3 text-xl font-bold">Totales por categoría</h2>
            <div id="categorias" class="grid gap-2"></div>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
